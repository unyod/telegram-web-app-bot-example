<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>

    <style>
        body{
            background:#0f172a;
            color:white;
            font-family:Arial;
            padding:20px;
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        th, td{
            border:1px solid white;
            padding:10px;
            text-align:center;
        }
    </style>
</head>
<body>

<h1>⚙️ ADMIN PANEL</h1>

<table>

<tr>
    <th>User ID</th>
    <th>Coins</th>
</tr>

{% for user in users %}
<tr>
    <td>{{ user['user_id'] }}</td>
    <td>{{ user['coins'] }}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
